name: Homeward Health
description: >-
  Homeward Health is a value-based healthcare provider founded in 2022 by former
  Livongo executives (CEO Dr. Jennifer Schneider) and incubated as the first
  investment in General Catalyst's Creation fund. Homeward is rearchitecting
  rural healthcare for the roughly 60 million Americans living in rural
  communities, taking on full financial risk for the total cost of care of
  Medicare Advantage members. Its hybrid care model combines telehealth visits
  over cellular networks, in-home remote patient monitoring, and in-person care
  delivered through mobile care units, in partnership with regional health plans
  (e.g. Priority Health), local providers, and community organizations. Homeward
  is a care-delivery and health-plan-partnership company rather than a developer
  platform; it publishes no public developer program, API, or SDK.
